<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question ❤️</title>
    <style>
        body { 
            text-align: center; 
            font-family: Arial, sans-serif; 
            background-color: #ffe6e6; 
            padding-top: 100px;
        }
        h1 { color: #d63384; font-size: 28px; }
        .btn-container { margin-top: 30px; }
        button { 
            font-size: 18px; 
            padding: 12px 25px; 
            margin: 10px; 
            border-radius: 20px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
        }
        .yes { background-color: #28a745; color: white; }
        .no { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

    <h1>Do you love me? ❤️</h1>
    <div class="btn-container">
        <button class="yes" onclick="alert('Yay! I love you too! 🥰')">Yes</button>
        <button class="no" onclick="alert('Try again! 😜')">No</button>
    </div>

</body>
</html>
