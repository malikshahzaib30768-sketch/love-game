<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question ❤️</title>
    <style>
        body { 
            text-align: center; 
            font-family: 'Poppins', Arial, sans-serif; 
            background-color: #ffe6e6; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 100%;
        }
        img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ff4d6d;
            margin-bottom: 20px;
        }
        h1 { 
            color: #d63384; 
            font-size: 24px; 
            margin-bottom: 20px;
        }
        .btn-container { 
            position: relative;
            min-height: 80px;
            margin-top: 10px;
        }
        button { 
            font-size: 18px; 
            padding: 12px 30px; 
            border-radius: 25px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .yes-btn { 
            background-color: #ff4d6d; 
            color: white; 
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.4);
        }
        .no-btn { 
            background-color: #6c757d; 
            color: white; 
            position: absolute;
        }
    </style>
</head>
<body>

    <div class="card">
        <img id="myPhoto" src="fdad7c4a2911469ee4b0212f7d8b6304.jpg" alt="Cute Image">
        
        <h1>Do you love me? ❤️</h1>
        
        <div class="btn-container">
            <button class="yes-btn" onclick="sayYes()">Yes 🥰</button>
            <button class="no-btn" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 😜</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 60);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function sayYes() {
            alert('Yay! I knew it! I love you too forever! ❤️🥰✨');
        }
    </script>

</body>
</html>
